      <script type="module">
  import { auth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.5.0/firebase-auth.js";
  import { auth as mainAuth } from "./javascript/firebaseauth.js";

  const loginBtn = document.getElementById("loginBtn");

  onAuthStateChanged(mainAuth, (user) => {
    if (user) {
      // user logged in → hide button
      if (loginBtn) loginBtn.style.display = "none";
    } else {
      // user logged out → show button
      if (loginBtn) loginBtn.style.display = "inline-block";
    }
  });
</script>

  <script type="module">
  // 🔹 Firebase import
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.5.0/firebase-app.js";
  import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.5.0/firebase-auth.js";

  // 🔹 তোমার Firebase config (যেটা firebaseauth.js এ ছিল সেইটিই এখানে দাও)
  const firebaseConfig = {
    apiKey: "AIzaSyA4p2HR9A9Ofn4av_WAj8A6FvAbGg5Ppi8",
    authDomain: "orlina-9eb08.firebaseapp.com",
    projectId: "orlina-9eb08",
    storageBucket: "orlina-9eb08.firebasestorage.app",
    messagingSenderId: "576624295485",
    appId: "1:576624295485:web:f4784acef7f190100a7454"
  };

  // 🔹 Initialize Firebase
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  // 🔹 যখন user state change হবে
  const loginBtn = document.getElementById("loginBtn");

  onAuthStateChanged(auth, (user) => {
    if (user) {
      // ইউজার লগইন করেছে → Login/Sign Up button লুকাও
      if (loginBtn) loginBtn.style.display = "none";
    } else {
      // ইউজার লগআউট বা নেই → button দেখাও
      if (loginBtn) loginBtn.style.display = "inline-block";
    }
  });
</script>
