<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="this is an ecommerce project for making Orlina ">
  <link rel="shortcut icon" href="icon.png" type="image/x-icon">
  <title>Orlina</title>
  <!--font awesome cdn-->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
    integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- Top Navbar -->
  <header class="navbar">
    <!-- Logo -->
    <div class="logo">
      <a href="index.html"><img src="images/logo.png" alt="Logo"></a>
    </div>
    <!-- Middle Links -->
    <nav class="nav-links">
      <a href="index.html">Home</a>
      <a href="#">Features</a>
      <a href="#">Products</a>
      <a href="#">Categories</a>
      <a href="#">Review</a>
      <a href="#">Blogs</a>
    </nav>
    <!-- Right Side Icons -->
    <div class="icons  flex-space-around">
      <li class="nav_list icon-item">
        <a href="index.html" class="nav_icons">
          <i class="fa fa-heart" class="heart_icon"></i>
        </a>
      </li>
      <li class="nav_list icon-item">
        <a href="cart.html" class="nav_icons">
          <i class="fa fa-shopping-cart" id="cart_icon"></i>
        </a>
      </li>
      <li class="nav_list icon-item">
        <a href="profile.html" class="nav_icons">
          <i class="fa fa-user" id="login_icon"></i>
        </a>
      </li>
    </div>
  </header>

  <main>
    <!-- 🔹 Login / Signup Section -->
    <div class="container">
      <h2>Orlina</h2>


      <!-- Login Box -->
      <div class="form-box" id="loginBox">
        <h3>Login</h3>
        <form>
          <input type="text" placeholder="Email or Username" required>
          <input type="password" placeholder="Password" required>
          <button type="submit">Login</button>
        </form>
        <p>Don't have an account?
          <a href="#" onclick="showSignup()">Sign Up</a>
        </p>
      </div>

      <!-- Signup Box -->
      <div class="form-box hidden" id="signupBox">
        <h3>Create Account</h3>
        <form>
          <input type="text" placeholder="First Name" required>
          <input type="text" placeholder="Last Name" required>
          <input type="text" placeholder="Username" required>
          <input type="email" placeholder="Email" required>
          <input type="password" placeholder="Password" required>
          <button type="submit">Sign Up</button>
        </form>
        <p>Already have an account?
          <a href="#" onclick="showLogin()">Login</a>
        </p>
      </div>
    </div>

    <!-- 🔹 JavaScript Toggle -->
    <script>
      const loginBox = document.getElementById('loginBox');
      const signupBox = document.getElementById('signupBox');

      function showSignup() {
        loginBox.classList.add('hidden');
        signupBox.classList.remove('hidden');
      }

      function showLogin() {
        signupBox.classList.add('hidden');
        loginBox.classList.remove('hidden');
      }
    </script>

    <!-- 🔹 Firebase Authentication Script -->
    <script type="module">
  import { auth } from "./javascript/firebaseauth.js";
  import {
    createUserWithEmailAndPassword,
    signInWithEmailAndPassword
  } from "https://www.gstatic.com/firebasejs/12.5.0/firebase-auth.js";

  // Signup
  const signupForm = document.querySelector('#signupBox form');
  signupForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = signupForm.querySelector('input[type="email"]').value;
    const password = signupForm.querySelector('input[type="password"]').value;
    try {
      await createUserWithEmailAndPassword(auth, email, password);
      alert("✅ Signup successful!");
      showLogin();
    } catch (err) {
      if (err.code === "auth/email-already-in-use") {
        alert("⚠️ This email is already registered. Please login instead.");
      } else {
        alert("❌ " + err.message);
      }
    }
  });

  // Login
  const loginForm = document.querySelector('#loginBox form');
  loginForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = loginForm.querySelector('input[type="text"]').value;
    const password = loginForm.querySelector('input[type="password"]').value;
    try {
      await signInWithEmailAndPassword(auth, email, password);
      alert("✅ Login successful!");
      window.location = "index.html";
    } catch (err) {
      if (err.code === "auth/invalid-credential" ||
          err.code === "auth/user-not-found") {
        alert("⚠️ Wrong email or password");
      } else {
        alert("❌ " + err.message);
      }
    }
  });
</script>

  </main>


  <!-- javascript link-->
  <script src="./javascript/index.js"></script>
</body>

</html>
